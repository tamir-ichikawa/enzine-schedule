<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>利用者ページ | enzine Schedule</title>
  <script src="ui-mode-bootstrap.js?v=1"></script>
  <link rel="icon" type="image/png" href="enzine_icon.png?v=81">
  <link rel="stylesheet" href="style.css?v=125">
</head>
<body class="app-shell-body">
  <!-- STEP2_FIXED_20260620_V30 -->
  <!-- STEP6_READABILITY_FIX_20260620_V35：返信通知・コンパクトWebUI -->
  <!-- STEP7_WEEKLY_REPORT_STABILITY_20260620_V36 -->
  <!-- STEP9_WEEKLY_REPORT_WEEKDAY_START_20260620_V38 -->
  <!-- STEP10_LOGO_IMAGE_20260620_V39 -->
  <!-- STEP11_USER_CALENDAR_READABILITY_20260620_V40 -->
  <!-- STEP12_CALENDAR_STYLE_TUNE_20260620_V41 -->
  <!-- STEP16_ASSET_VERSION_SYNC_20260620_V45 -->
  <!-- STEP18_ANNOUNCEMENT_STATUS_CACHE_20260620_V47 -->
  <!-- STEP20_USER_INPUT_ASSISTS_20260620_V49 -->
  <!-- STEP21_SAVE_AND_NEXT_WEEKDAY_20260620_V50 -->
  <!-- STEP22_CLEAR_USER_SCHEDULE_20260620_V51 -->
  <!-- STEP48_PUBLIC_BILLING_SAFETY_TEST_NOTICE_20260622_V78 -->
  <!-- STEP50_SETTINGS_MENU_CLOSE_20260622_V80 -->
  <!-- STEP51_WEEKLY_REPORT_NEW_USER_START_20260622_V81 -->
  <main class="login-container user-page app-main-shell">
    <header class="app-topbar" aria-label="ページヘッダー">
      <div class="app-brand">
        <img src="enzine_icon.png" alt="enzine" class="app-brand-logo-img">
        <div class="app-brand-text">
          <div class="app-brand-title">enzine スケジュール</div>
          <p id="userInfo" class="app-user-meta">ログイン確認中...</p>
        </div>
      </div>
      <div class="app-topbar-actions">
        <div class="app-current-section" aria-label="現在のページ">予定</div>
        <details class="app-settings-menu">
          <summary class="app-settings-button" aria-label="設定メニュー">⚙</summary>
          <div class="app-settings-panel">
            <div class="app-settings-panel-title">設定</div>
            <button id="logoutButton" type="button" class="app-settings-logout-button">ログアウト</button>
          </div>
        </details>
      </div>
    </header>

    <nav class="page-tab-nav user-page-tab-nav" aria-label="利用者メニュー">
      <a class="page-tab-button active" href="user.html">予定</a>
      <a class="page-tab-button user-weekly-report-nav-link" href="weekly-report.html">週一報告<span class="user-nav-notification-badge hidden" data-weekly-report-nav-badge hidden>0</span></a>
      <a class="page-tab-button" href="workshops.html">ワークショップ・教材</a>
    </nav>

    <section id="billingSafetyNotice" class="billing-safety-public-notice hidden" aria-live="polite"></section>

    <section id="weeklyReportReminderBox" class="weekly-report-reminder-box hidden">
      <div class="weekly-report-reminder-header">
        <div>
          <h2>週一報告があります</h2>
          <p id="weeklyReportReminderText">未記入の週一報告があります。記入をお願いします。</p>
        </div>
        <div id="weeklyReportReminderCount" class="weekly-report-reminder-count">0件</div>
      </div>
      <div id="weeklyReportReminderList" class="weekly-report-reminder-list"></div>
    </section>

    <section class="daily-overview-grid" aria-label="本日の確認">
      <section id="todayScheduleBox" class="today-schedule-box hidden">
        <div class="section-heading-row compact-section-heading-row">
          <h2>本日の予定</h2>
          <div id="todayScheduleText" class="today-schedule-text"></div>
        </div>
      </section>

      <section class="today-announcement-box">
        <div class="section-heading-row compact-section-heading-row">
          <h2>本日のアナウンス</h2>
        </div>
        <div id="todayAnnouncements" class="today-announcements">
          読み込み中...
        </div>
      </section>
    </section>

    <section class="monthly-calendar-box">
      <div class="section-heading-row">
        <h2 id="calendarTitle">今月の予定</h2>
        <p class="calendar-guide">日付をタップして予定を入力してください。</p>
      </div>

      <div class="calendar-month-nav">
        <button id="prevMonthButton" type="button" class="sub-button">＜ 前月</button>
        <div id="currentMonthLabel" class="calendar-month-label">読み込み中...</div>
        <button id="nextMonthButton" type="button" class="sub-button">次月 ＞</button>
      </div>

      <div class="calendar-view-toggle calendar-view-toggle-three">
        <button id="calendarViewButton" type="button" class="view-toggle-button active">月間表示</button>
        <button id="weekViewButton" type="button" class="view-toggle-button">週間表示</button>
        <button id="listViewButton" type="button" class="view-toggle-button">リスト表示</button>
      </div>

      <div id="weekNavigation" class="calendar-week-nav hidden">
        <button id="prevWeekButton" type="button" class="sub-button">＜ 前週</button>
        <div id="currentWeekLabel" class="calendar-week-label">今週</div>
        <button id="nextWeekButton" type="button" class="sub-button">次週 ＞</button>
      </div>

      <div id="calendarFilterBox" class="calendar-filter-box calendar-filter-box-with-action">
        <div class="calendar-filter-heading-row">
          <div id="calendarFilterTitle" class="calendar-filter-title">表示する日</div>
          <button id="calendarBulkRegisterButton" type="button" class="small-button calendar-bulk-register-button">一括登録</button>
        </div>
        <div id="calendarDisplayFilterControls" class="calendar-filter-options">
          <label class="calendar-filter-label">
            <input type="checkbox" id="showAllDaysCheckbox" checked>
            全体
          </label>
          <label class="calendar-filter-label">
            <input type="checkbox" id="showUseDaysCheckbox">
            利用日
          </label>
          <label class="calendar-filter-label">
            <input type="checkbox" id="showAnnouncementDaysCheckbox">
            アナウンス
          </label>
        </div>
        <div id="calendarBulkControls" class="calendar-bulk-controls hidden" hidden>
          <div class="calendar-bulk-choice-groups">
            <fieldset class="calendar-bulk-choice-group">
              <legend>予定</legend>
              <label class="calendar-bulk-choice-label">
                <input type="checkbox" id="calendarBulkStatusComing" value="通所">
                通所
              </label>
              <label class="calendar-bulk-choice-label">
                <input type="checkbox" id="calendarBulkStatusHome" value="在宅">
                在宅
              </label>
            </fieldset>
            <fieldset class="calendar-bulk-choice-group">
              <legend>時間帯</legend>
              <label class="calendar-bulk-choice-label">
                <input type="checkbox" id="calendarBulkTimeAll" value="終日">
                終日
              </label>
              <label class="calendar-bulk-choice-label">
                <input type="checkbox" id="calendarBulkTimeMorning" value="午前">
                午前
              </label>
              <label class="calendar-bulk-choice-label">
                <input type="checkbox" id="calendarBulkTimeAfternoon" value="午後">
                午後
              </label>
            </fieldset>
          </div>
          <div class="calendar-bulk-footer">
            <div id="calendarBulkSelectedCount" class="calendar-bulk-selected-count" aria-live="polite">選択中：0日</div>
            <button id="calendarBulkCancelButton" type="button" class="sub-button calendar-bulk-cancel-button">キャンセル</button>
          </div>
        </div>
        <div id="calendarBulkAlert" class="calendar-action-toast hidden" role="alert" aria-live="assertive" hidden></div>
      </div>

      <div id="calendarWeekHeader" class="calendar-week-header weekday-calendar-header">
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
      </div>

      <div id="monthlyCalendar" class="monthly-calendar weekday-calendar">
        読み込み中...
      </div>
    </section>

    <p id="message"></p>
  </main>

  <!-- 予定編集モーダル -->
  <div id="scheduleModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">予定を編集</h2>
        <button id="closeModalButton" class="modal-close-button">×</button>
      </div>

      <div class="modal-form">

        <section class="modal-announcement-box">
          <h3>本日の連絡・予定</h3>
          <div id="modalAnnouncements" class="modal-announcements">
            読み込み中...
          </div>
        </section>

        <div>
          <h3>あなたの予定</h3>
          <div class="modal-assist-row">
            <button id="applyLastScheduleButton" type="button" class="assist-chip-button hidden">前回の入力を使う</button>
            <button id="clearScheduleButton" type="button" class="assist-chip-button clear-user-schedule-button">未入力に戻す</button>
          </div>
          <div class="choice-button-group" id="statusButtonGroup">
            <button type="button" class="choice-button" data-status="通所">通所</button>
            <button type="button" class="choice-button" data-status="在宅">在宅</button>
            <button type="button" class="choice-button" data-status="休み">休み</button>
          </div>
        </div>

        <div id="timeSlotChoiceBox">
          <h3>時間帯</h3>
          <div class="choice-button-group" id="timeSlotButtonGroup">
            <button type="button" class="choice-button" data-timeslot="終日">終日</button>
            <button type="button" class="choice-button" data-timeslot="午前">午前</button>
            <button type="button" class="choice-button" data-timeslot="午後">午後</button>
          </div>
        </div>

        <!-- JS内部で値を使うため、画面には出さない -->
        <input type="hidden" id="scheduleDate">
        <input type="hidden" id="scheduleStatus">
        <input type="hidden" id="scheduleTimeSlot">

        <label>
          メモ
          <textarea id="scheduleMemo" placeholder="例：午前のみ、午後から、体調不良など"></textarea>
        </label>

        <button id="saveScheduleButton">保存</button>
        <button id="saveAndNextScheduleButton" type="button" class="sub-button save-and-next-button">保存して次の平日へ</button>
        <button id="cancelModalButton" class="sub-button">キャンセル</button>
      </div>
    </div>
  </div>

  <script type="module" src="schedule.js?v=98"></script>
</body>
</html>
