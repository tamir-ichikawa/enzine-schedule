<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>利用者ページ | Enzine Schedule</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <main class="login-container user-page">
    <header class="app-page-header compact-page-header">
      <h1>Enzine Schedule</h1>
      <p id="userInfo">ログイン確認中...</p>
    </header>

    <section id="todayScheduleBox" class="today-schedule-box hidden">
      <h2>本日の予定</h2>
      <div id="todayScheduleText" class="today-schedule-text"></div>
    </section>

    <section class="today-announcement-box">
      <h2>本日のアナウンス</h2>
      <div id="todayAnnouncements" class="today-announcements">
        読み込み中...
      </div>
    </section>

    <p class="calendar-guide">
      カレンダーの日付をタップして予定を入力してください。
    </p>

    <section class="monthly-calendar-box">
      <h2 id="calendarTitle">今月の予定</h2>

      <div class="calendar-month-nav">
        <button id="prevMonthButton" type="button" class="sub-button">＜ 前月</button>
        <div id="currentMonthLabel" class="calendar-month-label">読み込み中...</div>
        <button id="nextMonthButton" type="button" class="sub-button">次月 ＞</button>
      </div>

      <div class="calendar-view-toggle calendar-view-toggle-three">
        <button id="calendarViewButton" type="button" class="view-toggle-button active">月間表示</button>
        <button id="weekViewButton" type="button" class="view-toggle-button">週間表示</button>
        <button id="listViewButton" type="button" class="view-toggle-button">リスト表示</button>
      </div>

      <div id="weekNavigation" class="calendar-week-nav hidden">
        <button id="prevWeekButton" type="button" class="sub-button">＜ 前週</button>
        <div id="currentWeekLabel" class="calendar-week-label">今週</div>
        <button id="nextWeekButton" type="button" class="sub-button">次週 ＞</button>
      </div>

      <div class="calendar-filter-box">
        <div class="calendar-filter-title">表示する日</div>
        <label class="calendar-filter-label">
          <input type="checkbox" id="showAllDaysCheckbox" checked>
          全体
        </label>
        <label class="calendar-filter-label">
          <input type="checkbox" id="showUseDaysCheckbox">
          利用日
        </label>
        <label class="calendar-filter-label">
          <input type="checkbox" id="showAnnouncementDaysCheckbox">
          アナウンス
        </label>
      </div>

      <div id="calendarWeekHeader" class="calendar-week-header weekday-calendar-header">
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
      </div>

      <div id="monthlyCalendar" class="monthly-calendar weekday-calendar">
        読み込み中...
      </div>
    </section>

    <button id="logoutButton" class="sub-button logout-bottom">ログアウト</button>
    <p id="message"></p>
  </main>

  <!-- 予定編集モーダル -->
  <div id="scheduleModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">予定を編集</h2>
        <button id="closeModalButton" class="modal-close-button">×</button>
      </div>

      <div class="modal-form">

        <section class="modal-announcement-box">
          <h3>本日の連絡・予定</h3>
          <div id="modalAnnouncements" class="modal-announcements">
            読み込み中...
          </div>
        </section>

        <div>
          <h3>あなたの予定</h3>
          <div class="choice-button-group" id="statusButtonGroup">
            <button type="button" class="choice-button" data-status="通所">通所</button>
            <button type="button" class="choice-button" data-status="在宅">在宅</button>
            <button type="button" class="choice-button" data-status="休み">休み</button>
          </div>
        </div>

        <div id="timeSlotChoiceBox">
          <h3>時間帯</h3>
          <div class="choice-button-group" id="timeSlotButtonGroup">
            <button type="button" class="choice-button" data-timeslot="終日">終日</button>
            <button type="button" class="choice-button" data-timeslot="午前">午前</button>
            <button type="button" class="choice-button" data-timeslot="午後">午後</button>
          </div>
        </div>

        <!-- JS内部で値を使うため、画面には出さない -->
        <input type="hidden" id="scheduleDate">
        <input type="hidden" id="scheduleStatus">
        <input type="hidden" id="scheduleTimeSlot">

        <label>
          メモ
          <textarea id="scheduleMemo" placeholder="例：午前のみ、午後から、体調不良など"></textarea>
        </label>

        <button id="saveScheduleButton">保存</button>
        <button id="cancelModalButton" class="sub-button">キャンセル</button>
      </div>
    </div>
  </div>

  <script type="module" src="schedule.js?v=18"></script>
</body>
</html>
