<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>週一報告 | Enzine Schedule</title>
  <link rel="stylesheet" href="style.css?v=37">
</head>
<body class="app-shell-body">
  <!-- STEP2_FIXED_20260620_V30 -->
  <!-- STEP6_READABILITY_FIX_20260620_V35：返信通知・ロック表示 -->
  <!-- STEP7_WEEKLY_REPORT_STABILITY_20260620_V36 -->
  <!-- STEP9_WEEKLY_REPORT_WEEKDAY_START_20260620_V38 -->
  <main class="login-container user-page weekly-report-page app-main-shell">
    <header class="app-topbar" aria-label="ページヘッダー">
      <div class="app-brand">
        <span class="app-brand-icon" aria-hidden="true">e</span>
        <div class="app-brand-text">
          <div class="app-brand-title">enzine スケジュール</div>
          <p id="weeklyReportUserInfo" class="app-user-meta">ログイン確認中...</p>
        </div>
      </div>
      <div class="app-topbar-actions">
        <div class="app-current-section" aria-label="現在のページ">週一報告</div>
        <details class="app-settings-menu">
          <summary class="app-settings-button" aria-label="設定メニュー">⚙</summary>
          <div class="app-settings-panel">
            <div class="app-settings-panel-title">設定</div>
            <button id="logoutButton" type="button" class="app-settings-logout-button">ログアウト</button>
            <div class="app-settings-note">表示設定などは今後追加予定です。</div>
          </div>
        </details>
      </div>
    </header>

    <nav class="page-tab-nav user-page-tab-nav" aria-label="利用者メニュー">
      <a class="page-tab-button" href="user.html">予定</a>
      <a class="page-tab-button active" href="weekly-report.html">週一報告</a>
      <a class="page-tab-button" href="workshops.html">ワークショップ・教材</a>
    </nav>

    <section class="weekly-report-status-box">
      <h2 id="weeklyReportTitle">先週分の報告</h2>
      <p id="weeklyReportTargetText" class="calendar-guide">対象週を確認中...</p>

      <div class="weekly-report-week-nav">
        <button id="prevReportWeekButton" type="button" class="sub-button">＜ 前の週</button>
        <button id="currentReportWeekButton" type="button" class="sub-button">先週分へ戻る</button>
        <button id="nextReportWeekButton" type="button" class="sub-button">次の週 ＞</button>
      </div>

      <div id="weeklyReportStatusText" class="weekly-report-status-text">読み込み中...</div>
    </section>

    <section id="weeklyReportFeedbackBox" class="weekly-report-feedback-box hidden">
      <div class="section-heading-row">
        <h2>支援員からの返信</h2>
        <p class="calendar-guide">この返信を確認すると、利用者ページ上部の通知は消えます。</p>
      </div>
      <div id="weeklyReportFeedbackText" class="weekly-report-feedback-text"></div>
      <button id="markFeedbackReadButton" type="button" class="sub-button">返信を確認しました</button>
    </section>

    <section id="weeklyReportReadOnlyBox" class="weekly-report-readonly-box hidden">
      <div class="section-heading-row">
        <h2>提出済みの内容</h2>
        <p class="calendar-guide">支援員から返信があるため、この報告は修正できません。</p>
      </div>
      <div id="weeklyReportReadOnlyText" class="weekly-report-readonly-text"></div>
    </section>

    <section class="weekly-report-form-box">
      <div class="section-heading-row">
        <h2>報告内容</h2>
        <p class="calendar-guide">作業以外でも、家で頑張ったことや意識して過ごしたことを書いて大丈夫です。</p>
      </div>

      <form id="weeklyReportForm" class="weekly-report-form">
        <label>
          先週、どんな作業や活動をしましたか？
          <textarea id="workActivityText" required placeholder="例：AI画像生成の練習、デザイン課題、生活リズムを整えることなど"></textarea>
        </label>

        <label>
          先週の作業・活動時間の目安を教えてください
          <select id="activityTime" required>
            <option value="">選択してください</option>
            <option value="３０分未満">３０分未満</option>
            <option value="３０分～１時間">３０分～１時間</option>
            <option value="１時間～２時間">１時間～２時間</option>
            <option value="２時間以上">２時間以上</option>
            <option value="わからない/活動なし（追加質問あり）">わからない/活動なし（追加質問あり）</option>
          </select>
        </label>

        <label id="noActivityReasonLabel" class="hidden">
          活動なしと答えた方へ
          <textarea id="noActivityReason" placeholder="活動ができなかった理由を記入してください"></textarea>
        </label>

        <label>
          先週の体調や生活リズムについて教えてください
          <select id="healthStatus" required>
            <option value="">選択してください</option>
            <option value="体調良好・生活リズム安定">体調良好・生活リズム安定</option>
            <option value="体調まぁまぁ・生活リズムほぼ安定">体調まぁまぁ・生活リズムほぼ安定</option>
            <option value="体調不安定・生活リズム乱れがち">体調不安定・生活リズム乱れがち</option>
            <option value="体調悪い・生活崩れている">体調悪い・生活崩れている</option>
            <option value="よくわからない">よくわからない</option>
          </select>
        </label>

        <label>
          生活リズムについて詳しく教えてください
          <select id="lifeRhythm" required>
            <option value="">選択してください</option>
            <option value="週7日間すべて規則正しかった">週7日間すべて規則正しかった</option>
            <option value="週4〜6日間規則正しかった">週4〜6日間規則正しかった</option>
            <option value="週1〜3日間規則正しかった">週1〜3日間規則正しかった</option>
            <option value="規則正しい日がなかった">規則正しい日がなかった</option>
          </select>
        </label>

        <div>
          <h3>先週の自己採点（1～5満点）を教えてください</h3>
          <p class="weekly-report-help-text">自分自身の振り返り用であり、点数による評価はありません。</p>
          <input type="hidden" id="selfScore" required>
          <div id="selfScoreButtonGroup" class="choice-button-group weekly-score-buttons">
            <button type="button" class="choice-button" data-score="1">1</button>
            <button type="button" class="choice-button" data-score="2">2</button>
            <button type="button" class="choice-button" data-score="3">3</button>
            <button type="button" class="choice-button" data-score="4">4</button>
            <button type="button" class="choice-button" data-score="5">5</button>
          </div>
        </div>

        <label>
          困ったこと・しんどかったことがあれば教えてください
          <textarea id="troubleText" required placeholder="特になければ「特になし」と入力してください"></textarea>
        </label>

        <label>
          できたこと・がんばれたことがあれば教えてください
          <textarea id="goodText" required></textarea>
        </label>

        <label>
          今週意識したいこと、取り組みたいことがあれば教えてください
          <textarea id="nextWeekText" required></textarea>
        </label>

        <label>
          その他伝えたいこと、質問など
          <textarea id="otherText" placeholder="任意"></textarea>
        </label>

        <button id="saveWeeklyReportButton" type="submit">週一報告を保存</button>
      </form>
    </section>

    <button id="backToUserPageButton" type="button" class="sub-button logout-bottom">予定ページへ戻る</button>
    <p id="weeklyReportMessage"></p>
  </main>

  <script type="module" src="weekly-report.js?v=38"></script>
</body>
</html>
