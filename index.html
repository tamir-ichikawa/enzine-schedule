<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | enzine Schedule</title>
  <link rel="stylesheet" href="style.css?v=61">
</head>
<body class="app-shell-body">
  <!-- STEP8_LOGIN_UNIFY_20260620_V37 -->
  <!-- STEP10_LOGO_IMAGE_20260620_V39 -->
  <!-- STEP16_ASSET_VERSION_SYNC_20260620_V45 -->
  <main class="login-container login-page app-main-shell">
    <header class="login-page-header" aria-label="ログインページヘッダー">
      <div class="app-brand login-page-brand">
        <img src="enzine_icon.png" alt="enzine" class="app-brand-logo-img">
        <div class="app-brand-text">
          <h1 class="app-brand-title">enzine スケジュール</h1>
          <p class="app-user-meta">月間予定・週一報告管理</p>
        </div>
      </div>
    </header>

    <div class="login-box">
      <div class="section-heading-row login-heading-row">
        <h2>ログイン</h2>
        <p class="calendar-guide">登録済みアカウントで入ります。</p>
      </div>

      <form id="loginForm" class="login-form">
        <label>
          メールアドレス
          <input type="email" id="email" autocomplete="email" placeholder="example@example.com">
        </label>

        <label>
          パスワード
          <input type="password" id="password" autocomplete="current-password" placeholder="パスワード">
        </label>

        <button id="loginButton" type="submit">ログイン</button>
      </form>

      <p id="message" class="login-message" aria-live="polite"></p>
    </div>
  </main>

  <script type="module" src="auth.js?v=61"></script>
</body>
</html>
