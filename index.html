<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | enzine Schedule</title>
  <script src="ui-mode-bootstrap.js?v=1"></script>
  <link rel="icon" type="image/png" href="enzine_icon.png?v=81">
  <link rel="stylesheet" href="style.css?v=124">
</head>
<body class="app-shell-body">
  <!-- STEP8_LOGIN_UNIFY_20260620_V37 -->
  <!-- STEP10_LOGO_IMAGE_20260620_V39 -->
  <!-- STEP16_ASSET_VERSION_SYNC_20260620_V45 -->
  <!-- STEP41_ADMIN_USER_MANAGEMENT_20260622_V71 -->
  <!-- STEP51_FAVICON_LOGO_20260622_V81 -->
  <main class="login-container login-page app-main-shell">
    <header class="login-page-header" aria-label="ログインページヘッダー">
      <div class="app-brand login-page-brand">
        <img src="enzine_icon.png" alt="enzine" class="app-brand-logo-img">
        <div class="app-brand-text">
          <h1 class="app-brand-title">enzine スケジュール</h1>
        </div>
      </div>
    </header>

    <section id="loginMaintenanceNotice" class="maintenance-public-card hidden" aria-live="polite" hidden>
      <div class="maintenance-public-icon" aria-hidden="true">⚙</div>
      <h2>メンテナンス中です</h2>
      <p id="loginMaintenanceMessage" class="hidden" hidden></p>
    </section>

    <div id="loginBox" class="login-box hidden" hidden>
      <div class="section-heading-row login-heading-row">
        <h2 id="loginHeadingTitle">ログイン</h2>
      </div>

      <form id="loginForm" class="login-form">
        <label>
          メールアドレス
          <input type="email" id="email" autocomplete="email" placeholder="example@example.com">
        </label>

        <label>
          パスワード
          <input type="password" id="password" autocomplete="current-password" placeholder="パスワード">
        </label>

        <button id="loginButton" type="submit">ログイン</button>
      </form>

      <p id="message" class="login-message" aria-live="polite"></p>
    </div>
  </main>

  <script type="module" src="auth.js?v=79"></script>
</body>
</html>
