<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>支援員ページ | Enzine Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-container">
    <h1>支援員ページ</h1>
    <p id="staffInfo">ログイン確認中...</p>

    <section class="login-box">
      <h2>日別予定一覧</h2>

      <label>
        表示する日付
        <input type="date" id="targetDate">
      </label>

      <button id="loadButton">一覧を表示</button>
      <button id="logoutButton" class="sub-button">ログアウト</button>

      <p id="message"></p>
    </section>

    <section class="staff-list-box">
      <h2>本日の一覧</h2>

      <div class="status-group">
        <h3>通所</h3>
        <ul id="comingList"></ul>
      </div>

      <div class="status-group">
        <h3>在宅</h3>
        <ul id="homeList"></ul>
      </div>

      <div class="status-group">
        <h3>休み</h3>
        <ul id="offList"></ul>
      </div>

      <div class="status-group">
        <h3>その他・未分類</h3>
        <ul id="otherList"></ul>
      </div>
    </section>
  </main>

  <script type="module" src="staff.js"></script>
</body>
</html>
